name: Malilator Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    name: Validate and package standard APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out source and native submodules
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17 and Gradle cache
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Restore Android toolchain cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-34
            ${{ env.ANDROID_HOME }}/build-tools/35.0.0
            ${{ env.ANDROID_HOME }}/cmake/3.22.1
            ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
          key: android-34-bt35-cmake3.22.1-ndk29-${{ runner.os }}

      - name: Install required Android packages
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865"

      - name: Run unit tests, lint, and standard APK builds
        shell: bash
        run: |
          mkdir -p artifacts
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew \
            :app:testStandardDebugUnitTest \
            :app:lintStandardDebug \
            :app:assembleStandardDebug \
            :app:assembleStandardRelease \
            --no-daemon --parallel --build-cache --stacktrace --console=plain \
            2>&1 | tee artifacts/gradle-build.log

      - name: Prepare clearly named APK artifacts
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/standard/debug/app-standard-debug.apk \
            artifacts/Malilator-standard-debug.apk
          release_apk="$(find app/build/outputs/apk/standard/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$release_apk"
          cp "$release_apk" artifacts/Malilator-standard-release-unsigned.apk

      - name: Upload APKs and build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Malilator-standard-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
